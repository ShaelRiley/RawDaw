[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prde1-core"
version = "0.1.0"
description = "PRDE1 prepared-sample contracts, Governor, and offline render checkpoint"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Shael Riley"}]
dependencies = []

[project.scripts]
prde1 = "prde1.cli:main"

[tool.setuptools]
packages = ["prde1"]
